name: Probe sources
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        run: |
          set -x
          mkdir -p out && cd out
          d=$(date -d "-1 day" +%Y%m%d)
          curl -s -o gias.csv "https://ea-edubase-api-prod.azurewebsites.net/edubase/downloads/public/edubasealldata$d.csv"
          head -1 gias.csv | tr ',' '\n' | grep -n -i "ofsted\|inspect\|Easting\|Northing\|Phase\|Postcode\|NumberOfPupils\|LA (code)" > gias2.txt
          python - >> gias2.txt <<'PY'
          import csv, collections
          r = csv.DictReader(open("gias.csv", encoding="cp1252"))
          c = collections.Counter(); n = 0
          for row in r:
              if row["EstablishmentStatus (name)"] != "Open" or not row["LA (code)"].startswith(("2", "3")):
                  continue
              n += 1
              c[(row.get("OfstedRating (name)"), row["PhaseOfEducation (name)"])] += 1
          print(n); print(c.most_common(40))
          PY
          for h in https://overpass-api.de https://overpass.kumi.systems https://overpass.private.coffee; do
            echo "== $h" >> osm2.txt
            curl -s -m 120 -H "Accept: application/json" -A "Mozilla/5.0 (london-property-finder; github.com/EgeErenler/london-property-finder)" --data-urlencode 'data=[out:json][timeout:90];area["ISO3166-2"="GB-LND"]->.a;(nwr["shop"="supermarket"](area.a););out center 2;' "$h/api/interpreter" | head -c 1500 >> osm2.txt
          done
          rm -f *.zip *.csv *.xlsx *.html
      - name: Push
        run: |
          cd out
          git init -q -b probe && git config user.name "github-actions[bot]" && git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm probe
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe
